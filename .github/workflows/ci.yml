# CI 잡 하나 — 하는 일은 검증기 · 테스트 · 빌드뿐 (ADR 0001 결정 4)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # 26.x 중 최신을 고른다. 27은 탈락 (WHY.md §5 — 베타 · 구형 SPM 깨짐)
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"

      - name: Boundary verifier
        working-directory: apple
        run: swift scripts/verify-boundaries.swift

      - name: Kernel tests
        run: swift test --package-path apple/Packages/MomentKernel

      - name: PhotoSource tests
        run: swift test --package-path apple/Packages/PhotoSource

      - name: Build app (iOS Simulator)
        run: >
          xcodebuild build
          -project apple/Moanogi.xcodeproj
          -scheme Moanogi
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

      # 앱 테스트는 시뮬레이터를 실제로 띄운다 — generic 목적지로는 안 돈다.
      # 기기 이름은 러너 이미지마다 다르므로 iOS 26+ 중 마지막 iPhone을 골라 쓴다.
      - name: App tests (iOS Simulator)
        run: |
          SIM=$(xcrun simctl list devices available | awk '/^-- iOS 2[6-9]/{ok=1;next} /^--/{ok=0} ok && /iPhone/{gsub(/ \(.*/,"");gsub(/^ +/,"");n=$0} END{print n}')
          echo "시뮬레이터: $SIM"
          xcodebuild test -project apple/Moanogi.xcodeproj -scheme Moanogi \
            -destination "platform=iOS Simulator,name=$SIM" CODE_SIGNING_ALLOWED=NO
