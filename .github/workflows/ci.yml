# CI 잡 하나 — 하는 일은 `apple/scripts/gates.sh`를 부르는 것뿐이다.
#
# 명령을 여기 적지 않는다. 에이전트가 손으로 돌리는 것과 CI가 돌리는 것이
# 두 벌로 살면 한쪽이 낡고, 낡은 쪽으로 돈 세션이 초록을 잘못 믿는다.
# 잡을 게이트마다 쪼개지 않는 대가로 스텝 단위 표시를 잃지만,
# 스크립트가 게이트마다 ✅/❌를 찍고 실패한 것만 로그를 편다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # 26.x 중 최신을 고른다. 27은 탈락 — 베타고 구형 SPM이 깨진다
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"

      - name: Gates
        run: apple/scripts/gates.sh
